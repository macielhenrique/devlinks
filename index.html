<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Links oficiais de Henrique Maciel: Kick, Instagram, TikTok, Twitch e YouTube."
    />
    <meta name="theme-color" content="#1e1208" />

    <link rel="preconnect" href="https://api.fontshare.com" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=clash-display@600&f[]=inter@400,500,600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="./assets/toranja-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />

    <title>Henrique Maciel | Links oficiais</title>
  </head>

  <body>
    <a class="skip-link" href="#links">Ir para os links</a>

    <div class="page-shell">
      <header class="brand-header" aria-label="Toranja Tech">
        <a
          class="brand-link"
          href="https://toranjatech.com.br/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Visitar o site da Toranja Tech"
        >
          <img src="./assets/toranja-wordmark.svg" alt="Toranja Tech" />
        </a>
        <span class="brand-pill">Links oficiais</span>
      </header>

      <main>
        <section class="profile" aria-labelledby="profile-name">
          <div class="avatar-wrap">
            <img
              class="avatar"
              src="./assets/avatar.png"
              width="112"
              height="112"
              alt="Henrique Maciel sorrindo, usando óculos e camisa preta"
            />
            <span class="status-dot" aria-hidden="true"></span>
          </div>

          <div class="profile-copy">
            <p class="eyebrow">Criador e fundador da Toranja Tech</p>
            <h1 id="profile-name">Henrique Maciel</h1>
            <p class="handle">@zhenriquemaciel</p>
            <p class="intro">Lives, vídeos e conteúdo. Escolha onde quer me acompanhar.</p>
          </div>
        </section>

        <nav id="links" class="link-list" aria-label="Redes e canais de Henrique Maciel"></nav>
      </main>

      <footer>
        <span>Uma experiência</span>
        <a
          href="https://toranjatech.com.br/"
          target="_blank"
          rel="noopener noreferrer"
        >Toranja Tech</a>
      </footer>
    </div>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script nomodule src="https://unpkg.com/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
